name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: Build backend
        working-directory: server
        run: npm run build
      - name: Run backend security and analysis tests
        working-directory: server
        run: npm test
      - name: Run API integration journeys
        working-directory: server
        run: npm run test:integration
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright test runner
        working-directory: web
        run: npm install --no-save @playwright/test
      - name: Install Chromium for browser tests
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end journeys
        working-directory: web
        run: npm run test:e2e
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
